name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release notes
        id: notes
        shell: bash
        run: |
          previous_tag=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          notes_file="$RUNNER_TEMP/release-notes.md"

          if [[ -n "$previous_tag" ]]; then
            range="$previous_tag..$GITHUB_REF_NAME"
          else
            range="$GITHUB_REF_NAME"
          fi

          {
            echo "## Changes"
            echo
            git log "$range" --no-merges --pretty=format:'- %s (`%h`)'
            echo
            if [[ -n "$previous_tag" ]]; then
              echo
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$previous_tag...$GITHUB_REF_NAME"
            fi
          } > "$notes_file"

          echo "file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "ICS Extranet $GITHUB_REF_NAME" \
            --notes-file "$NOTES_FILE" \
            --verify-tag \
            --latest
